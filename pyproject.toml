[project]
name = "dota2-ml-inference"
version = "0.1.0"
description = "Dota 2 player momentum and skill-bracket inference with FastAPI and SQLite"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5", "joblib>=1.4"]
# gem-dota internals are used for streaming, so pin the exact version
replay = ["gem-dota==0.14.0"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dota*", "app*"]

[tool.setuptools.package-data]
app = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
